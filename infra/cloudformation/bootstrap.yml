AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ResearchNexus bootstrap (deploy once per AWS account and region, before
  researchnexus.yml): the two image repositories, and the role GitHub Actions
  assumes through OIDC to deploy -- no long-lived AWS keys in GitHub.

Parameters:
  GitHubRepository:
    Type: String
    Default: Varshanrpsit057/Researchnexus
    Description: owner/name of the GitHub repository allowed to deploy
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if this account already has the token.actions.githubusercontent.com OIDC provider
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: its ARN, when CreateGitHubOidcProvider is false

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: researchnexus/backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images (rollback targets)",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
          "action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: researchnexus/frontend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 30 images (rollback targets)",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},
          "action":{"type":"expire"}}]}

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: researchnexus-github-deploy
      Description: Assumed by GitHub Actions (OIDC) to push images and roll out ECS services
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # only workflow jobs running in this repository's staging/production environments
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:environment:staging
                  - !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: push-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt BackendRepository.Arn
                  - !GetAtt FrontendRepository.Arn
        - PolicyName: roll-out-services
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:RunTask
                Resource: "*"
                Condition:
                  StringLike:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/researchnexus-*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/researchnexus-*-task-execution
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/researchnexus-*-backend-task
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/researchnexus-*-frontend-task
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/researchnexus-*/*
              - Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/researchnexus/*

Outputs:
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
  DeployRoleArn:
    Description: set as the GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
