# ResearchNexus in containers, on this machine: the production images, on
# PostgreSQL, with the usual ports (frontend http://localhost:3000, backend
# http://localhost:8000).
#
#   cp .env.example .env      # then fill in the two secrets (see the file)
#   docker compose up --build
#
# It runs in "development" mode because it is plain http on localhost:
# cookies aren't marked Secure, and sign-in codes are printed in the backend's
# log instead of emailed (`docker compose logs -f backend`). Everything else
# is as deployed: the built images (no dev servers), PostgreSQL, migrations as
# their own step before the backend starts. DEPLOYMENT.md covers the real
# (AWS) deployment.

name: researchnexus

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: researchnexus
      POSTGRES_USER: researchnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchnexus -d researchnexus"]
      interval: 5s
      timeout: 3s
      retries: 20
    # not published on the host: only the backend talks to it

  migrate:
    build: ./backend
    command: ["migrate"]
    env_file: .env
    environment: &backend-env
      RESEARCHNEXUS_ENVIRONMENT: development
      RESEARCHNEXUS_DATABASE_URL: postgresql+psycopg://researchnexus:${POSTGRES_PASSWORD}@db:5432/researchnexus
      RESEARCHNEXUS_PUBLIC_APP_URL: http://localhost:3000
      RESEARCHNEXUS_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      RESEARCHNEXUS_EMAIL_BACKEND: console
      RESEARCHNEXUS_DB_AUTO_CREATE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - papers:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  papers:
