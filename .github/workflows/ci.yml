name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # a throwaway CI database, not a secret
      RESEARCHNEXUS_TEST_POSTGRES_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app tests
      - name: Pytest (SQLite; every migration also runs on PostgreSQL)
        run: pytest -q
      - name: Integration tests on PostgreSQL
        env:
          RESEARCHNEXUS_TEST_ON_POSTGRES: "1"
        run: pytest -q tests/integration
      - name: Migrations upgrade, downgrade and upgrade again on PostgreSQL
        env:
          RESEARCHNEXUS_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0020
          python -m alembic upgrade head
      - name: Dependency audit (known vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
        run: npm run build
      - name: No development address in the production bundle
        run: |
          if grep -rl "localhost:8000" .next/static; then
            echo "the production bundle points at a local backend"; exit 1
          fi
      - name: Dependency audit (high and critical, shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t researchnexus-backend:ci ./backend
      - name: Build the frontend image
        run: docker build -t researchnexus-frontend:ci ./frontend
      - name: The backend image starts and reports ready
        run: |
          docker run -d --name rn-backend -p 8000:8000 \
            -e RESEARCHNEXUS_ENVIRONMENT=development \
            -e RESEARCHNEXUS_SECRET_KEY="$(openssl rand -hex 32)" \
            -e RESEARCHNEXUS_DATABASE_URL=sqlite:////data/smoke.db \
            researchnexus-backend:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/ready && exit 0
            sleep 2
          done
          docker logs rn-backend; exit 1
      - name: The production configuration check refuses an incomplete setup
        run: |
          if docker run --rm -e RESEARCHNEXUS_ENVIRONMENT=production researchnexus-backend:ci check; then
            echo "an incomplete production configuration was accepted"; exit 1
          fi
      - name: The frontend image serves the app
        run: |
          docker run -d --name rn-frontend -p 3000:3000 researchnexus-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && curl -fsSI http://localhost:3000/ | grep -i content-security-policy && exit 0
            sleep 2
          done
          docker logs rn-frontend; exit 1
