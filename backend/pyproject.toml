[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchnexus-backend"
version = "0.1.0"
description = "ResearchNexus backend (Phases 1-14: auth/BYOK, ingestion, profiles, academic search, discovery, ranking, typed research trail, research workspace, verified RAG + citations, multi-paper comparison, evidence-grounded research gaps, research directions, per-workspace research graph, agentic orchestrator)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-jose[cryptography]>=3.3",
  "cryptography>=42.0",
  "defusedxml>=0.7",
  # discovery relevance: bge-small embeddings on ONNX Runtime (no torch);
  # its ~70 MB model downloads once into data/models on first use
  "fastembed>=0.4",
]

# Heavy/optional retrieval backends. Kept OUT of the default install so Phase 2
# (PDF ingestion) never requires a torch/transformers download. See
# app/retrieval/embeddings.py and app/retrieval/faiss_store.py: the interfaces
# are defined and unit-tested now (with a dependency-free fake), the real
# providers are lazy-imported and exercised starting with the discovery/RAG
# phases (Roadmap P5/P9).
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.2"]
faiss = ["faiss-cpu>=1.8"]
dev = [
  "pytest>=8.0",
  "reportlab>=4.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
